name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "PyQt6>=6.5" pyinstaller

      - name: Run tests
        run: pytest tests/ -v

      - name: Build executable
        run: pyinstaller logo2svg_gui.spec --noconfirm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/QuickLayer/* -DestinationPath "QuickLayer-${{ steps.version.outputs.VERSION }}-windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QuickLayer-*.zip
          generate_release_notes: true
          draft: false
