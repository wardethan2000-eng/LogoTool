<!DOCTYPE html>
<html>
<head>
<style>
body { background: #333; color: white; font-family: sans-serif; margin: 20px; }
h2 { margin: 10px 0 5px; }
.comparison { display: flex; gap: 20px; flex-wrap: wrap; }
.panel { position: relative; background: white; }
.panel img, .panel object { display: block; }
.overlay-container { position: relative; display: inline-block; }
.overlay-container img { display: block; }
.overlay-container object { position: absolute; top: 0; left: 0; opacity: 0.7; }
#opacitySlider { width: 300px; }
</style>
</head>
<body>
<h1>LogoTool SVG Comparison</h1>
<p>Opacity: <input type="range" id="opacitySlider" min="0" max="100" value="70">
   <span id="opVal">70%</span></p>
<div class="comparison">
  <div>
    <h2>Original PNG</h2>
    <div class="panel"><img src="white_sox.png" width="800"></div>
  </div>
  <div>
    <h2>SVG Output</h2>
    <div class="panel"><object data="white_sox_combined.svg" type="image/svg+xml" width="800"></object></div>
  </div>
  <div>
    <h2>SVG overlaid on PNG (use slider)</h2>
    <div class="overlay-container">
      <img src="white_sox.png" width="800">
      <object id="svgOverlay" data="white_sox_combined.svg" type="image/svg+xml" width="800" style="opacity:0.7"></object>
    </div>
  </div>
</div>
<h2>Individual Layers</h2>
<div class="comparison">
  <div>
    <h2>Black (#221F21)</h2>
    <div class="panel"><object data="white_sox_color_221F21.svg" type="image/svg+xml" width="800"></object></div>
  </div>
  <div>
    <h2>Light Gray (#C2CCD4)</h2>
    <div class="panel"><object data="white_sox_color_C2CCD4.svg" type="image/svg+xml" width="800"></object></div>
  </div>
</div>
<h2>Preview (quantized + masks)</h2>
<div class="panel" style="overflow-x:auto"><img src="white_sox_preview.png" height="300"></div>
<script>
const slider = document.getElementById('opacitySlider');
const overlay = document.getElementById('svgOverlay');
const val = document.getElementById('opVal');
slider.addEventListener('input', () => {
  overlay.style.opacity = slider.value / 100;
  val.textContent = slider.value + '%';
});
</script>
</body>
</html>
